<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoujahidJewels - Joaillerie d'Exception</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        

        body {

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            background: #f8f8f8;

            font-family: 'Poppins', sans-serif;

        }

        

        .business-card {

            width: 350px;

            max-height: 80vh;

            background: white;

            border-radius: 20px;

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);

            position: relative;

            overflow-y: auto;

            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

        }

        

        .cover-container {

            position: relative;

            height: 180px;

            overflow: hidden;

        }

        

        .cover-photo {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }

        

        .cover-fade {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            height: 80px;

            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 70%, white 100%);

        }

        

        .profile-pic {

            width: 100px;

            height: 100px;

            border-radius: 50%;

            border: 4px solid white;

            object-fit: cover;

            position: absolute;

            top: 130px;

            left: 50%;

            transform: translateX(-50%);

            box-shadow: 0 10px 30px rgba(0,0,0,0.15);

            z-index: 2;

        }

        

        .content {

            padding: 60px 25px 25px;

            text-align: center;

        }

        

        .name {

            font-family: 'Playfair Display', serif;

            font-size: 24px;

            font-weight: 700;

            margin: 15px 0 5px;

            color: #222;

            letter-spacing: 0.5px;

        }

        

        .company {

            font-size: 16px;

            font-weight: 600;

            color: #d4af37;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }

        

        .description {

            font-size: 13px;

            color: #777;

            margin-bottom: 20px;

            font-weight: 400;

            line-height: 1.6;

        }

        

        .social-buttons {

            display: flex;

            flex-direction: column; /* Modification ici */

            align-items: center; /* Centrage des boutons */

            gap: 15px;

            margin: 25px 0;

        }

        

        .instagram-btn {

            padding: 10px 20px;

            border-radius: 30px;

            background: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);

            color: white;

            text-decoration: none;

            font-weight: 500;

            font-size: 14px;

            display: flex;

            align-items: center;

            gap: 8px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.1);

            transition: all 0.3s;

        }

        

        .instagram-btn:hover {

            transform: translateY(-3px);

            box-shadow: 0 8px 20px rgba(0,0,0,0.15);

        }

        

        .instagram-btn img {

            width: 16px;

            height: 16px;

        }

        

        .gallery {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 8px;

            margin: 20px 0;

        }

        

        .gallery a {

            width: 100%;

            height: 80px;

            border-radius: 6px;

            overflow: hidden;

            transition: all 0.3s;

            box-shadow: 0 3px 8px rgba(0,0,0,0.1);

        }

        

        .gallery a:hover {

            transform: scale(1.05);

            box-shadow: 0 5px 15px rgba(0,0,0,0.15);

        }

        

        .gallery img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .map-container {

            width: 100%;

            height: 200px;

            border-radius: 10px;

            margin: 20px 0 15px;

            overflow: hidden;

            position: relative;

            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

        }

        .map-address {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            background: rgba(0,0,0,0.7);

            color: white;

            padding: 10px;

            font-size: 12px;

            text-align: center;

        }

        .gold-divider {

            width: 50px;

            height: 2px;

            background: #d4af37;

            margin: 15px auto;

            border-radius: 2px;

        }

        

        .footer {

            font-size: 11px;

            color: #999;

            margin-top: 20px;

            padding-top: 15px;

            border-top: 1px solid #eee;

        }

        

        .jewel-icon {

            color: #d4af37;

            margin: 0 3px;

        }

    </style>

</head>
